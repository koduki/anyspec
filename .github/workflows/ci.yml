name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        ruby-version: ['3.2']

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec spec/anyspec --format documentation

      - name: Verify CLI works
        run: |
          bundle exec ruby -Ilib bin/anyspec --version
          bundle exec ruby -Ilib bin/anyspec --help

      - name: Validate example specs (offline)
        run: bundle exec ruby -Ilib bin/anyspec validate examples/
        env:
          OCI_TENANCY_OCID: ocid1.tenancy.oc1..test
          OCI_NAMESPACE: test-namespace
