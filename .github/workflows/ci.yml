name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec spec/anyspec --format documentation

      - name: Verify CLI works
        run: |
          bundle exec ruby -Ilib bin/anyspec --version
          bundle exec ruby -Ilib bin/anyspec --help
